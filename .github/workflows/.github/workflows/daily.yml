name: Daily Gemara Summary
on:
  schedule:
    - cron: '0 5 * * *' # Runs daily at 05:00 UTC (07:00/08:00 Israel time)
  workflow_dispatch:     # Lets you click "Run workflow" manually to test anytime

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gemara_agent.py
